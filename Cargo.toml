[package]
name = "arch-audit"
version = "0.2.0"
authors = ["Andrea Scarpino <andrea@scarpino.dev>", "Levente Polyak <anthraxx@archlinux.org>"]
description = "A utility like pkg-audit for Arch Linux based on Arch Security Team data"
repository = "https://gitlab.archlinux.org/archlinux/arch-audit"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["archlinux", "security"]
edition = "2021"

[[bin]]
name = "arch-audit"

[dependencies]
alpm = "^3.0"
anyhow = "^1.0"
reqwest = { version = "^0.12", default-features = false, features = ["rustls-tls-native-roots", "socks", "gzip", "brotli"] }
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }
env_logger = "^0.11"
log = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
term = "^0.7"
strum = "^0.26"
strum_macros = "^0.26"
url = "^2.5"
lazy_static = "^1.5"
toml = "^0.8"
dirs-next = "^2.0"
console = "0.15.8"
clap = { version = "4.5.9", features = ["env", "derive", "wrap_help"] }
clap_complete = "4.5.8"

[dev-dependencies]
tempfile = "^3.10"

[features]
git = ["alpm/git"]

[profile.release]
lto = true
codegen-units = 1
